---
# Namespace, service account, RBAC and the S3 credential for the etcd backup
# jobs. Split from the CronJob policy so the CronJobs can declare a dependency
# and never land on a cluster whose credential has not synced yet.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-etcd-backup-prereqs
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Prerequisites for the managed cluster etcd backup: the ocp-etcd-backup
      namespace, a service account allowed to run privileged on control plane
      nodes, read access to the etcd encryption key secrets, and an
      ExternalSecret that syncs the S3 uploader credential from the existing
      ClusterSecretStore.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: etcd-backup-prereqs
        spec:
          remediationAction: enforce
          severity: high
          # Clean up if a cluster is de-labelled / the policy is removed.
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ocp-etcd-backup
                  labels:
                    # The backup pod is privileged and uses the host PID
                    # namespace; opt the namespace out of PSA enforcement.
                    pod-security.kubernetes.io/enforce: privileged
                    pod-security.kubernetes.io/audit: privileged
                    pod-security.kubernetes.io/warn: privileged
                    security.openshift.io/scc.podSecurityLabelSync: "false"

            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: etcd-backup
                  namespace: ocp-etcd-backup

            # Allows the pods to run with the `privileged` SCC. Scoped to the
            # backup namespace rather than granted cluster-wide.
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: etcd-backup-scc-privileged
                  namespace: ocp-etcd-backup
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: system:openshift:scc:privileged
                subjects:
                  - kind: ServiceAccount
                    name: etcd-backup
                    namespace: ocp-etcd-backup

            # Read the APIServer config (did this cluster have etcd encryption
            # on, and with which provider) and the ClusterVersion (which
            # z-stream this backup can be restored onto).
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: etcd-backup-reader
                rules:
                  - apiGroups: ["config.openshift.io"]
                    resources: ["apiservers", "clusterversions"]
                    verbs: ["get", "list"]
                  - apiGroups: ["operator.openshift.io"]
                    resources: ["etcds", "kubeapiservers", "openshiftapiservers"]
                    verbs: ["get", "list"]

            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: etcd-backup-reader
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: etcd-backup-reader
                subjects:
                  - kind: ServiceAccount
                    name: etcd-backup
                    namespace: ocp-etcd-backup

            # THE ETCD ENCRYPTION KEYS.
            # When etcd encryption is on, the AES keys live as secrets named
            # encryption-key-<component>-<N> in openshift-config-managed.
            # Namespace-scoped read access, nothing wider.
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: etcd-backup-encryption-keys
                  namespace: openshift-config-managed
                rules:
                  - apiGroups: [""]
                    resources: ["secrets"]
                    verbs: ["get", "list"]

            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: etcd-backup-encryption-keys
                  namespace: openshift-config-managed
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: etcd-backup-encryption-keys
                subjects:
                  - kind: ServiceAccount
                    name: etcd-backup
                    namespace: ocp-etcd-backup

            # S3 credential, synced by the External Secrets Operator from the
            # ClusterSecretStore you already run (AWS Secrets Manager behind it).
            #
            # A pod can only read Secrets in its own namespace, which is why
            # this pulls into ocp-etcd-backup rather than referencing an
            # ExternalSecret that lives somewhere else.
            #
            # apiVersion note: external-secrets.io/v1beta1 was removed in ESO
            # v0.17.0 and the compatibility flag expired in May 2026, so v1 is
            # correct for any current install. The schemas are identical, so on
            # an older ESO this is a one-word change.
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: etcd-backup-s3
                  namespace: ocp-etcd-backup
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_store_name" hub}}'
                    kind: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_store_kind" hub}}'
                  target:
                    name: etcd-backup-s3
                    creationPolicy: Owner
                    deletionPolicy: Delete
                  data:
                    - secretKey: aws_access_key_id
                      remoteRef:
                        key: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_remote_key" hub}}'
                        property: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_key_id_property" hub}}'
                    - secretKey: aws_secret_access_key
                      remoteRef:
                        key: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_remote_key" hub}}'
                        property: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "secret_access_key_property" hub}}'

            # Gate the CronJob policy on the credential actually having synced.
            # Without this an upload job can start before ESO has written the
            # Secret and fail on a missing secretKeyRef.
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: etcd-backup-s3
                  namespace: ocp-etcd-backup
                status:
                  conditions:
                    - type: Ready
                      status: "True"
