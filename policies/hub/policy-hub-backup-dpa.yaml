---
# Policy 3 of the hub chain: point Velero at the S3 bucket.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-hub-backup-dpa
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Creates the DataProtectionApplication that connects the hub's Velero
      instance to the S3 backup bucket, using the STS web-identity credential
      minted by the Cloud Credential Operator.
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-hub-backup-oadp
      namespace: etcd-backup-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-backup-dpa
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: oadp.openshift.io/v1alpha1
                kind: DataProtectionApplication
                metadata:
                  name: dpa-acm-hub
                  namespace: open-cluster-management-backup
                spec:
                  # The hub backup is pure Kubernetes resource data. Disabling
                  # image backup avoids requiring an exposed internal registry
                  # route, which ROSA HCP does not give you by default.
                  backupImages: false
                  configuration:
                    velero:
                      defaultPlugins:
                        - openshift
                        - aws
                      resourceTimeout: 10m
                    nodeAgent:
                      # Restic/Kopia file-system backup is not supported on
                      # ROSA STS and is not needed for ACM hub resources.
                      enable: false
                      uploaderType: kopia
                  backupLocations:
                    - velero:
                        provider: aws
                        default: true
                        credential:
                          name: cloud-credentials
                          key: credentials
                        config:
                          # CHANGEME: must match aws/setup-aws.sh output.
                          region: us-east-1
                          profile: "default"
                          enableSharedConfig: "true"
                          sts_regional_endpoints: regional
                          # Optional: SSE-KMS key ARN for the hub backup bucket.
                          # Remove this line to use the bucket's default encryption.
                          kmsKeyId: "CHANGEME-or-delete-this-line"
                        objectStorage:
                          bucket: "CHANGEME-acm-hub-backup"
                          prefix: "acm-hub"
