---
# Policies 1 and 2 of the hub chain.
#
# WHY THIS IS NOT AN etcd SNAPSHOT:
# The hub runs on ROSA with Hosted Control Planes. Its etcd members live in a
# Red Hat-owned AWS account; there are no control plane nodes in your account,
# `oc debug node/<master>` has nothing to attach to, and /usr/local/bin/cluster-backup.sh
# does not exist anywhere you can reach. A hub etcd snapshot is therefore not
# obtainable - by you, and per Red Hat solution 7045845, not by Red Hat SRE either.
#
# What IS obtainable, and what actually matters for hub recovery, is the ACM
# hub state: managed cluster registrations, policies, applications, cluster
# credentials, Bare Metal Assets, ManagedServiceAccounts. The ACM cluster-backup
# operator captures exactly that set via OADP/Velero into S3, and is the
# supported restore path onto a replacement hub. That is what this chain builds.
#
# Chain order (enforced with spec.dependencies):
#   1. policy-hub-backup-enable-component  -> MultiClusterHub cluster-backup: true
#   2. policy-hub-backup-oadp              -> OADP operator, STS role wiring
#   3. policy-hub-backup-dpa               -> DataProtectionApplication -> S3
#   4. policy-hub-backup-schedule          -> BackupSchedule
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-hub-backup-enable-component
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Enables the cluster-backup component on the MultiClusterHub. On a ROSA
      STS/HCP hub this creates the open-cluster-management-backup namespace and
      the cluster-backup operator, but deliberately does NOT auto-install OADP -
      OADP must be installed separately so that the STS role ARN can be supplied.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-backup-enable-component
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.open-cluster-management.io/v1
                kind: MultiClusterHub
                metadata:
                  name: multiclusterhub
                  namespace: open-cluster-management
                spec:
                  overrides:
                    components:
                      - name: cluster-backup
                        enabled: true
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-hub-backup-oadp
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Installs the OADP operator into open-cluster-management-backup with the
      ROLEARN env var set, so that the Cloud Credential Operator (running in
      manual/STS mode on ROSA) mints the `cloud-credentials` secret for Velero
      via AssumeRoleWithWebIdentity. No static AWS keys are used on the hub.
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-hub-backup-enable-component
      namespace: etcd-backup-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-backup-oadp
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: open-cluster-management-backup

            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: redhat-oadp-operator-group
                  namespace: open-cluster-management-backup
                spec:
                  targetNamespaces:
                    - open-cluster-management-backup

            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: redhat-oadp-operator
                  namespace: open-cluster-management-backup
                spec:
                  # CHANGEME: must match the channel the installed ACM version
                  # expects. The cluster-backup chart writes the correct value
                  # into the configmap `acm-redhat-oadp-operator-subscription`
                  # in open-cluster-management-backup once the component above
                  # is enabled - read it and set this to match:
                  #   oc get cm acm-redhat-oadp-operator-subscription \
                  #     -n open-cluster-management-backup -o yaml
                  channel: stable-1.5
                  name: redhat-oadp-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                  installPlanApproval: Automatic
                  config:
                    env:
                      # CHANGEME: the "ROLEARN value" printed by aws/setup-aws.sh.
                      # Role must trust the HUB cluster's OIDC provider for the
                      # subjects system:serviceaccount:open-cluster-management-backup:velero
                      # and :openshift-adp-controller-manager.
                      - name: ROLEARN
                        value: "arn:aws:iam::CHANGEME-ACCOUNT-ID:role/CHANGEME-hub-oadp-irsa-role"
