---
# Policy 4 of the hub chain: the actual recurring hub backup.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-hub-backup-schedule
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Creates the ACM BackupSchedule, which generates six velero Schedules
      (credentials, credentials-hive, credentials-cluster, resources,
      resources-generic, managed-clusters) writing to the S3 bucket configured
      in the DataProtectionApplication.
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-hub-backup-dpa
      namespace: etcd-backup-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-backup-schedule
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: BackupSchedule
                metadata:
                  name: schedule-acm
                  namespace: open-cluster-management-backup
                spec:
                  veleroSchedule: "0 */2 * * *"
                  veleroTtl: 720h
                  # Creates a ManagedServiceAccount per managed cluster so a
                  # restored hub can re-attach existing managed clusters without
                  # re-running the import by hand. Requires the
                  # managed-serviceaccount component to be enabled on the MCH.
                  useManagedServiceAccount: true
---
# Inform-only: surfaces a BackupCollision (another hub writing to the same
# storage location) and any schedule that has stopped being Enabled. A
# collision silently stops backups, so this is worth alerting on.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-hub-backup-healthy
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Reports non-compliant if the hub BackupSchedule is not in phase Enabled
      or if the Velero BackupStorageLocation is not Available.
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-backup-healthy
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: BackupSchedule
                metadata:
                  name: schedule-acm
                  namespace: open-cluster-management-backup
                status:
                  phase: Enabled
            - complianceType: musthave
              objectDefinition:
                apiVersion: velero.io/v1
                kind: BackupStorageLocation
                metadata:
                  namespace: open-cluster-management-backup
                status:
                  phase: Available
