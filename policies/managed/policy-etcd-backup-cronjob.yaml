---
# The managed cluster etcd backup itself.
#
# Runs on a control plane node, calls the etcd operator's own cluster-backup.sh
# (a supported wrapper around `etcdctl snapshot save` plus the static pod
# resources), separately exports the etcd encryption key secrets, then ships
# everything to S3 and deletes the local copies.
#
# Output per run:
#   s3://<s3_bucket>/<s3_prefix>/<cluster>/<ts>/snapshot_<ts>.db
#   s3://<s3_bucket>/<s3_prefix>/<cluster>/<ts>/SHA256SUMS
#   s3://<s3_keys_bucket>/<s3_keys_prefix>/<cluster>/<ts>/static_kuberesources_<ts>.tar.gz
#   s3://<s3_keys_bucket>/<s3_keys_prefix>/<cluster>/<ts>/encryption-keys_<ts>.tar.gz
#   s3://<s3_keys_bucket>/<s3_keys_prefix>/<cluster>/<ts>/SHA256SUMS
#
# The split is deliberate: static_kuberesources_<ts>.tar.gz contains the etcd
# encryption keys, and Red Hat's guidance is to store it apart from the
# snapshot - whoever holds both holds the decrypted cluster.
#
# ONLY applies to standalone OpenShift clusters. See placement-managed.yaml.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-etcd-backup-cronjob
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Deploys a CronJob that takes an etcd snapshot plus the etcd encryption
      keys on a control plane node and uploads them to S3.
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-etcd-backup-prereqs
      namespace: etcd-backup-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: etcd-backup-cronjob
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: etcd-backup
                  namespace: ocp-etcd-backup
                  labels:
                    app.kubernetes.io/name: etcd-backup
                spec:
                  schedule: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "schedule" hub}}'
                  timeZone: "Etc/UTC"
                  concurrencyPolicy: Forbid
                  # If the hub/node was down at the scheduled minute, still run
                  # if we are within 10 minutes of it.
                  startingDeadlineSeconds: 600
                  successfulJobsHistoryLimit: 3
                  failedJobsHistoryLimit: 3
                  jobTemplate:
                    spec:
                      backoffLimit: 2
                      activeDeadlineSeconds: 3600
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/name: etcd-backup
                        spec:
                          restartPolicy: Never
                          serviceAccountName: etcd-backup
                          # etcd listens in the host network namespace; chroot
                          # alone does not cross namespaces, so the pod needs it.
                          hostNetwork: true
                          hostPID: true
                          # Without this, `oc` cannot resolve the API service
                          # when hostNetwork is set.
                          dnsPolicy: ClusterFirstWithHostNet
                          nodeSelector:
                            node-role.kubernetes.io/master: ""
                          tolerations:
                            - key: node-role.kubernetes.io/master
                              operator: Exists
                              effect: NoSchedule
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                              effect: NoSchedule
                            - key: node.kubernetes.io/unschedulable
                              operator: Exists
                              effect: NoSchedule
                          volumes:
                            - name: host
                              hostPath:
                                path: /
                                type: Directory
                            - name: staging
                              hostPath:
                                path: /var/tmp/etcd-backup
                                type: DirectoryOrCreate

                          initContainers:
                            # ---- 1. etcd snapshot + static pod resources ----
                            - name: snapshot
                              image: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "ose_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: host
                                  mountPath: /host
                                - name: staging
                                  mountPath: /backup
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  echo "[snapshot] node=${NODE_NAME} clearing staging dir"
                                  rm -rf /backup/* /backup/.[!.]* 2>/dev/null || true

                                  if [ ! -x /host/usr/local/bin/cluster-backup.sh ]; then
                                    echo "FATAL: /usr/local/bin/cluster-backup.sh not found on this node." >&2
                                    echo "       This cluster has no reachable control plane (managed/hosted" >&2
                                    echo "       control plane?). Exclude it from the Placement." >&2
                                    exit 1
                                  fi

                                  echo "[snapshot] running cluster-backup.sh"
                                  chroot /host /bin/bash -euo pipefail -c \
                                    '/usr/local/bin/cluster-backup.sh /var/tmp/etcd-backup'

                                  echo "[snapshot] produced:"
                                  ls -lh /backup
                              env:
                                - name: NODE_NAME
                                  valueFrom:
                                    fieldRef:
                                      fieldPath: spec.nodeName
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi

                            # ---- 2. etcd encryption keys ----
                            # cluster-backup.sh already folds the encryption
                            # keys into static_kuberesources_<ts>.tar.gz, but
                            # that tarball is opaque and tied to a restore
                            # flow. Exporting the key secrets explicitly means
                            # you can decrypt an old snapshot even if the
                            # tarball layout changes between releases.
                            - name: encryption-keys
                              image: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "ose_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: staging
                                  mountPath: /backup
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  shopt -s nullglob

                                  snaps=(/backup/snapshot_*.db)
                                  if [ "${#snaps[@]}" -eq 0 ]; then
                                    echo "FATAL: no snapshot in /backup" >&2
                                    exit 1
                                  fi
                                  TS="$(basename "${snaps[0]}" .db)"
                                  TS="${TS#snapshot_}"

                                  OUT=/backup/encryption-keys
                                  mkdir -p "${OUT}"

                                  ENC="$(oc get apiserver cluster -o jsonpath='{.spec.encryption.type}' 2>/dev/null || true)"
                                  echo "encryption.type=${ENC:-identity (disabled)}" | tee "${OUT}/ENCRYPTION-TYPE.txt"
                                  oc get apiserver cluster -o yaml > "${OUT}/apiserver-cluster.yaml" 2>/dev/null || true

                                  n=0
                                  for s in $(oc get secrets -n openshift-config-managed -o name 2>/dev/null \
                                             | grep '^secret/encryption-key-' || true); do
                                    name="${s#secret/}"
                                    oc get -n openshift-config-managed "${s}" -o yaml \
                                      > "${OUT}/openshift-config-managed_${name}.yaml"
                                    n=$((n+1))
                                  done

                                  if [ "${n}" -eq 0 ]; then
                                    echo "[keys] no encryption-key-* secrets found."
                                    echo "[keys] etcd encryption appears to be disabled on this cluster;"
                                    echo "[keys] the snapshot is not encrypted at the application layer."
                                  else
                                    echo "[keys] exported ${n} encryption key secret(s)"
                                  fi

                                  tar -czf "/backup/encryption-keys_${TS}.tar.gz" -C /backup encryption-keys
                                  rm -rf "${OUT}"
                                  echo "[keys] wrote encryption-keys_${TS}.tar.gz"
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi

                          containers:
                            # ---- 3. upload + verify + purge local copies ----
                            - name: upload
                              image: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "aws_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: staging
                                  mountPath: /backup
                              env:
                                - name: CLUSTER_NAME
                                  value: '{{hub .ManagedClusterName hub}}'
                                - name: S3_BUCKET
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "s3_bucket" hub}}'
                                - name: S3_PREFIX
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "s3_prefix" hub}}'
                                - name: S3_KEYS_BUCKET
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "s3_keys_bucket" hub}}'
                                - name: S3_KEYS_PREFIX
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "s3_keys_prefix" hub}}'
                                - name: AWS_DEFAULT_REGION
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "s3_region" hub}}'
                                - name: KMS_KEY_ID
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "kms_key_id" hub}}'
                                - name: KMS_KEY_ID_KEYS
                                  value: '{{hub fromConfigMap "open-cluster-management-backup" "etcd-backup-config" "kms_key_id_keys" hub}}'
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom:
                                    secretKeyRef:
                                      name: etcd-backup-s3
                                      key: aws_access_key_id
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom:
                                    secretKeyRef:
                                      name: etcd-backup-s3
                                      key: aws_secret_access_key
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  shopt -s nullglob
                                  cd /backup

                                  snaps=(snapshot_*.db)
                                  if [ "${#snaps[@]}" -eq 0 ]; then
                                    echo "FATAL: nothing to upload" >&2
                                    exit 1
                                  fi
                                  TS="$(basename "${snaps[0]}" .db)"; TS="${TS#snapshot_}"
                                  RUN="${CLUSTER_NAME}/${TS}"

                                  if [ -n "${KMS_KEY_ID}" ]; then
                                    SNAP_SSE=(--sse aws:kms --sse-kms-key-id "${KMS_KEY_ID}")
                                  else
                                    SNAP_SSE=(--sse AES256)
                                  fi
                                  if [ -n "${KMS_KEY_ID_KEYS}" ]; then
                                    KEYS_SSE=(--sse aws:kms --sse-kms-key-id "${KMS_KEY_ID_KEYS}")
                                  else
                                    KEYS_SSE=(--sse AES256)
                                  fi

                                  keymat=(static_kuberesources_*.tar.gz encryption-keys_*.tar.gz)

                                  sha256sum -- "${snaps[@]}" "${keymat[@]}" > SHA256SUMS
                                  cat SHA256SUMS

                                  echo "[upload] snapshot -> s3://${S3_BUCKET}/${S3_PREFIX}/${RUN}/"
                                  for f in "${snaps[@]}" SHA256SUMS; do
                                    aws s3 cp "${f}" "s3://${S3_BUCKET}/${S3_PREFIX}/${RUN}/${f}" \
                                      "${SNAP_SSE[@]}" --only-show-errors
                                  done

                                  echo "[upload] key material -> s3://${S3_KEYS_BUCKET}/${S3_KEYS_PREFIX}/${RUN}/"
                                  for f in "${keymat[@]}" SHA256SUMS; do
                                    aws s3 cp "${f}" "s3://${S3_KEYS_BUCKET}/${S3_KEYS_PREFIX}/${RUN}/${f}" \
                                      "${KEYS_SSE[@]}" --only-show-errors
                                  done

                                  # Verify with list-objects-v2, not head-object:
                                  # head-object needs s3:GetObject, which would
                                  # make this credential able to read back every
                                  # other cluster's snapshots and keys. ListBucket
                                  # is enough to confirm the write landed and
                                  # keeps the credential write-only.
                                  echo "[verify] confirming objects exist before local delete"
                                  verify() {
                                    local bucket="$1" key="$2"
                                    local got
                                    got="$(aws s3api list-objects-v2 --bucket "${bucket}" \
                                             --prefix "${key}" --max-items 1 \
                                             --query 'Contents[0].Size' --output text)"
                                    if [ -z "${got}" ] || [ "${got}" = "None" ]; then
                                      echo "FATAL: ${bucket}/${key} missing after upload" >&2
                                      exit 1
                                    fi
                                    echo "  ok ${bucket}/${key} (${got} bytes)"
                                  }
                                  for f in "${snaps[@]}"; do
                                    verify "${S3_BUCKET}" "${S3_PREFIX}/${RUN}/${f}"
                                  done
                                  for f in "${keymat[@]}"; do
                                    verify "${S3_KEYS_BUCKET}" "${S3_KEYS_PREFIX}/${RUN}/${f}"
                                  done

                                  # Leaving snapshots + encryption keys lying on
                                  # a node's filesystem is the thing this job is
                                  # supposed to avoid. Retention is the S3
                                  # lifecycle rule's job, not this node's.
                                  echo "[cleanup] removing local staging copies"
                                  rm -f -- *

                                  echo "[done] ${RUN}"
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 512Mi
