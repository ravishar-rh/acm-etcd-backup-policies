---
# Two CronJobs, deliberately decoupled.
#
#   etcd-backup          snapshots etcd onto the control plane node and stops.
#                        Nothing is uploaded, nothing is deleted.
#   etcd-backup-upload   runs 5 minutes later, copies any finished-but-not-yet-
#                        uploaded backup to S3, and leaves it on the node.
#
# They hand off through the node's filesystem at /var/lib/etcd-backup, using
# one directory per run plus two marker files:
#
#   /var/lib/etcd-backup/<ts>/.complete   snapshot finished and is consistent
#   /var/lib/etcd-backup/<ts>/.uploaded   this directory reached S3
#
# The markers are what make the 5-minute gap safe rather than merely likely to
# work. The uploader only touches directories marked .complete, so a snapshot
# that overruns its window is not half-copied - it is just picked up on the
# next pass. And because .uploaded is written only after every object is
# confirmed present in S3, a failed upload retries rather than being skipped.
#
# S3 layout - each cluster owns a top-level directory named after it:
#
#   s3://<s3_bucket>/<cluster>/<ts>/snapshot_<ts>.db
#   s3://<s3_bucket>/<cluster>/<ts>/BACKUP-INFO.txt
#   s3://<s3_bucket>/<cluster>/<ts>/SHA256SUMS
#
#   s3://<s3_keys_bucket>/<cluster>/<ts>/static_kuberesources_<ts>.tar.gz
#   s3://<s3_keys_bucket>/<cluster>/<ts>/encryption-keys_<ts>.tar.gz
#   s3://<s3_keys_bucket>/<cluster>/<ts>/SHA256SUMS
#
# ONLY applies to standalone OpenShift clusters. See placement.yaml.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-etcd-backup-cronjob
  namespace: etcd-backup-policies
  annotations:
    policy.open-cluster-management.io/categories: CP-9 Information System Backup
    policy.open-cluster-management.io/controls: CP-9
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: >-
      Deploys the etcd snapshot CronJob and the separate S3 upload CronJob that
      follows it.
spec:
  remediationAction: enforce
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-etcd-backup-prereqs
      namespace: etcd-backup-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: etcd-backup-cronjob
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:

            # =================================================================
            # 1. SNAPSHOT - writes to the node, uploads nothing
            # =================================================================
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: etcd-backup
                  namespace: ocp-etcd-backup
                  labels:
                    app.kubernetes.io/name: etcd-backup
                spec:
                  schedule: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "schedule" hub}}'
                  timeZone: "Etc/UTC"
                  concurrencyPolicy: Forbid
                  startingDeadlineSeconds: 600
                  successfulJobsHistoryLimit: 3
                  failedJobsHistoryLimit: 3
                  jobTemplate:
                    spec:
                      backoffLimit: 2
                      activeDeadlineSeconds: 3600
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/name: etcd-backup
                        spec:
                          restartPolicy: Never
                          serviceAccountName: etcd-backup
                          # etcd listens in the host network namespace and
                          # chroot does not cross namespaces.
                          hostNetwork: true
                          hostPID: true
                          # Without this, `oc` cannot resolve the API service
                          # when hostNetwork is set.
                          dnsPolicy: ClusterFirstWithHostNet
                          nodeSelector:
                            node-role.kubernetes.io/master: ""
                          tolerations:
                            - key: node-role.kubernetes.io/master
                              operator: Exists
                              effect: NoSchedule
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                              effect: NoSchedule
                            - key: node.kubernetes.io/unschedulable
                              operator: Exists
                              effect: NoSchedule
                          volumes:
                            - name: host
                              hostPath:
                                path: /
                                type: Directory
                            - name: backups
                              hostPath:
                                path: /var/lib/etcd-backup
                                type: DirectoryOrCreate

                          initContainers:
                            # ---- etcd snapshot + static pod resources ----
                            - name: snapshot
                              image: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "ose_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: host
                                  mountPath: /host
                                - name: backups
                                  mountPath: /backups
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail

                                  if [ ! -x /host/usr/local/bin/cluster-backup.sh ]; then
                                    echo "FATAL: /usr/local/bin/cluster-backup.sh not found on this node." >&2
                                    echo "       This cluster has no reachable control plane (managed or" >&2
                                    echo "       hosted control plane?). Exclude it from the Placement." >&2
                                    exit 1
                                  fi

                                  # /var/lib/etcd-backup usually shares a
                                  # filesystem with /var/lib/etcd. Filling it
                                  # would take etcd down, which is a far worse
                                  # outcome than a missed backup - so refuse to
                                  # start unless there is room for roughly two
                                  # copies of the current database.
                                  ETCD_BYTES="$(du -sb /host/var/lib/etcd 2>/dev/null | cut -f1 || echo 0)"
                                  AVAIL_BYTES="$(df -B1 --output=avail /backups | tail -1 | tr -d ' ')"
                                  NEED_BYTES=$(( ETCD_BYTES * 2 + 1073741824 ))
                                  echo "[snapshot] etcd=${ETCD_BYTES}B avail=${AVAIL_BYTES}B need=${NEED_BYTES}B"
                                  if [ "${AVAIL_BYTES}" -lt "${NEED_BYTES}" ]; then
                                    echo "FATAL: not enough free space on the node for a safe snapshot." >&2
                                    echo "       Lower local_keep, or give /var/lib/etcd-backup its own mount." >&2
                                    exit 1
                                  fi

                                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                                  mkdir -p "/backups/${TS}"
                                  # Hand the run id to the later containers.
                                  echo "${TS}" > /backups/.current

                                  echo "[snapshot] node=${NODE_NAME} run=${TS}"
                                  chroot /host /bin/bash -euo pipefail -c \
                                    "/usr/local/bin/cluster-backup.sh /var/lib/etcd-backup/${TS}"

                                  ls -lh "/backups/${TS}"
                              env:
                                - name: NODE_NAME
                                  valueFrom:
                                    fieldRef:
                                      fieldPath: spec.nodeName
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi

                            # ---- etcd encryption keys ----
                            # cluster-backup.sh already folds these into
                            # static_kuberesources_<ts>.tar.gz, but that tarball
                            # is opaque and tied to a version-specific restore
                            # flow. The explicit export lets you decrypt an old
                            # snapshot offline if the layout drifts.
                            - name: encryption-keys
                              image: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "ose_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: backups
                                  mountPath: /backups
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  TS="$(cat /backups/.current)"
                                  DIR="/backups/${TS}"
                                  OUT="${DIR}/encryption-keys"
                                  mkdir -p "${OUT}"

                                  ENC="$(oc get apiserver cluster -o jsonpath='{.spec.encryption.type}' 2>/dev/null || true)"
                                  echo "encryption.type=${ENC:-identity (disabled)}" | tee "${OUT}/ENCRYPTION-TYPE.txt"
                                  oc get apiserver cluster -o yaml > "${OUT}/apiserver-cluster.yaml" 2>/dev/null || true

                                  n=0
                                  for s in $(oc get secrets -n openshift-config-managed -o name 2>/dev/null \
                                             | grep '^secret/encryption-key-' || true); do
                                    name="${s#secret/}"
                                    oc get -n openshift-config-managed "${s}" -o yaml \
                                      > "${OUT}/openshift-config-managed_${name}.yaml"
                                    n=$((n+1))
                                  done

                                  if [ "${n}" -eq 0 ]; then
                                    echo "[keys] no encryption-key-* secrets found."
                                    echo "[keys] etcd encryption appears disabled; the snapshot is not"
                                    echo "[keys] encrypted at the application layer."
                                  else
                                    echo "[keys] exported ${n} encryption key secret(s)"
                                  fi

                                  tar -czf "${DIR}/encryption-keys_${TS}.tar.gz" -C "${DIR}" encryption-keys
                                  rm -rf "${OUT}"
                                  echo "[keys] wrote encryption-keys_${TS}.tar.gz"
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi

                          containers:
                            # ---- checksum, mark complete, prune old runs ----
                            - name: finalize
                              image: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "ose_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: backups
                                  mountPath: /backups
                              env:
                                - name: CLUSTER_NAME
                                  value: '{{hub .ManagedClusterName hub}}'
                                - name: LOCAL_KEEP
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "local_keep" hub}}'
                                - name: NODE_NAME
                                  valueFrom:
                                    fieldRef:
                                      fieldPath: spec.nodeName
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  shopt -s nullglob

                                  TS="$(cat /backups/.current)"
                                  DIR="/backups/${TS}"
                                  cd "${DIR}"

                                  # An etcd snapshot only restores onto the same
                                  # z-stream, so record what that was.
                                  {
                                    echo "cluster=${CLUSTER_NAME}"
                                    echo "node=${NODE_NAME}"
                                    echo "timestamp=${TS}"
                                    echo "openshiftVersion=$(oc get clusterversion version \
                                          -o jsonpath='{.status.desired.version}' 2>/dev/null || echo unknown)"
                                  } > BACKUP-INFO.txt
                                  cat BACKUP-INFO.txt

                                  snaps=(snapshot_*.db)
                                  statics=(static_kuberesources_*.tar.gz)
                                  if [ "${#snaps[@]}" -eq 0 ] || [ "${#statics[@]}" -eq 0 ]; then
                                    echo "FATAL: incomplete backup - not marking .complete" >&2
                                    exit 1
                                  fi

                                  sha256sum -- snapshot_*.db static_kuberesources_*.tar.gz \
                                               encryption-keys_*.tar.gz BACKUP-INFO.txt > SHA256SUMS
                                  cat SHA256SUMS

                                  # Only now is this directory eligible for upload.
                                  touch .complete
                                  rm -f /backups/.current
                                  echo "[finalize] ${DIR} complete"

                                  # ---- on-node retention ----
                                  cd /backups
                                  i=0
                                  for d in $(ls -1d */ 2>/dev/null | sed 's#/##' | sort -r); do
                                    i=$((i+1))
                                    [ "${i}" -le "${LOCAL_KEEP}" ] && continue
                                    if [ ! -f "${d}/.uploaded" ]; then
                                      echo "WARNING: pruning ${d}, which never reached S3." >&2
                                      echo "WARNING: check the upload CronJob - backups are being lost." >&2
                                    fi
                                    rm -rf "${d}"
                                    echo "[retention] pruned ${d}"
                                  done

                                  echo "[retention] kept:"
                                  ls -1d /backups/*/ 2>/dev/null || echo "  (none)"
                                  df -h /backups | tail -1
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi

            # =================================================================
            # 2. UPLOAD - 5 minutes later, copies to S3, deletes nothing
            # =================================================================
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: etcd-backup-upload
                  namespace: ocp-etcd-backup
                  labels:
                    app.kubernetes.io/name: etcd-backup-upload
                spec:
                  schedule: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "upload_schedule" hub}}'
                  timeZone: "Etc/UTC"
                  concurrencyPolicy: Forbid
                  startingDeadlineSeconds: 600
                  successfulJobsHistoryLimit: 3
                  failedJobsHistoryLimit: 3
                  jobTemplate:
                    spec:
                      # The snapshot can land on any control plane node, and
                      # hostPath is per-node, so the uploader has to run
                      # everywhere. One pod per master, forced apart by
                      # anti-affinity; pods that find nothing new exit quickly.
                      # Quoted and piped through toInt: unquoted, a leading
                      # "{{" is YAML flow-mapping syntax, and these fields must
                      # end up as integers rather than strings.
                      completions: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "control_plane_count" hub | toInt}}'
                      parallelism: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "control_plane_count" hub | toInt}}'
                      backoffLimit: 2
                      activeDeadlineSeconds: 3600
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/name: etcd-backup-upload
                        spec:
                          restartPolicy: Never
                          serviceAccountName: etcd-backup
                          nodeSelector:
                            node-role.kubernetes.io/master: ""
                          tolerations:
                            - key: node-role.kubernetes.io/master
                              operator: Exists
                              effect: NoSchedule
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                              effect: NoSchedule
                            - key: node.kubernetes.io/unschedulable
                              operator: Exists
                              effect: NoSchedule
                          affinity:
                            podAntiAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                                - labelSelector:
                                    matchLabels:
                                      app.kubernetes.io/name: etcd-backup-upload
                                  topologyKey: kubernetes.io/hostname
                          volumes:
                            - name: backups
                              hostPath:
                                path: /var/lib/etcd-backup
                                type: DirectoryOrCreate
                          containers:
                            - name: upload
                              image: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "aws_cli_image" hub}}'
                              imagePullPolicy: IfNotPresent
                              # Needs root + privileged to read the root-owned
                              # hostPath without tripping SELinux. It does not
                              # need hostNetwork or hostPID - unlike the
                              # snapshot job, it never talks to etcd.
                              securityContext:
                                privileged: true
                                runAsUser: 0
                              volumeMounts:
                                - name: backups
                                  mountPath: /backups
                              env:
                                - name: CLUSTER_NAME
                                  value: '{{hub .ManagedClusterName hub}}'
                                - name: S3_BUCKET
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "s3_bucket" hub}}'
                                - name: S3_KEYS_BUCKET
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "s3_keys_bucket" hub}}'
                                - name: AWS_DEFAULT_REGION
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "s3_region" hub}}'
                                - name: KMS_KEY_ID
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "kms_key_id" hub}}'
                                - name: KMS_KEY_ID_KEYS
                                  value: '{{hub fromConfigMap "etcd-backup-policies" "etcd-backup-config" "kms_key_id_keys" hub}}'
                                - name: NODE_NAME
                                  valueFrom:
                                    fieldRef:
                                      fieldPath: spec.nodeName
                                # Synced by the ExternalSecret created in
                                # policy-etcd-backup-prereqs.yaml.
                                - name: AWS_ACCESS_KEY_ID
                                  valueFrom:
                                    secretKeyRef:
                                      name: etcd-backup-s3
                                      key: aws_access_key_id
                                - name: AWS_SECRET_ACCESS_KEY
                                  valueFrom:
                                    secretKeyRef:
                                      name: etcd-backup-s3
                                      key: aws_secret_access_key
                              command:
                                - /bin/bash
                                - -c
                                - |
                                  set -euo pipefail
                                  shopt -s nullglob
                                  cd /backups

                                  if [ -n "${KMS_KEY_ID}" ]; then
                                    SNAP_SSE=(--sse aws:kms --sse-kms-key-id "${KMS_KEY_ID}")
                                  else
                                    SNAP_SSE=(--sse AES256)
                                  fi
                                  if [ -n "${KMS_KEY_ID_KEYS}" ]; then
                                    KEYS_SSE=(--sse aws:kms --sse-kms-key-id "${KMS_KEY_ID_KEYS}")
                                  else
                                    KEYS_SSE=(--sse AES256)
                                  fi

                                  # Confirms an object is really in S3. Uses
                                  # list-objects-v2 rather than head-object so
                                  # the credential needs no s3:GetObject and
                                  # stays write-only.
                                  verify() {
                                    local bucket="$1" key="$2" got
                                    got="$(aws s3api list-objects-v2 --bucket "${bucket}" \
                                             --prefix "${key}" --max-items 1 \
                                             --query 'Contents[0].Size' --output text)"
                                    if [ -z "${got}" ] || [ "${got}" = "None" ]; then
                                      echo "FATAL: ${bucket}/${key} missing after upload" >&2
                                      return 1
                                    fi
                                    echo "    ok ${bucket}/${key} (${got} bytes)"
                                  }

                                  uploaded=0; pending=0; done_already=0

                                  for d in */; do
                                    d="${d%/}"

                                    if [ ! -f "${d}/.complete" ]; then
                                      echo "[skip] ${d}: snapshot still in progress"
                                      pending=$((pending+1))
                                      continue
                                    fi
                                    if [ -f "${d}/.uploaded" ]; then
                                      done_already=$((done_already+1))
                                      continue
                                    fi

                                    echo "[upload] ${d}"
                                    cd "/backups/${d}"

                                    snaps=(snapshot_*.db)
                                    keymat=(static_kuberesources_*.tar.gz encryption-keys_*.tar.gz)

                                    # Snapshot -> s3://<bucket>/<cluster>/<ts>/
                                    for f in "${snaps[@]}" BACKUP-INFO.txt SHA256SUMS; do
                                      aws s3 cp "${f}" "s3://${S3_BUCKET}/${CLUSTER_NAME}/${d}/${f}" \
                                        "${SNAP_SSE[@]}" --only-show-errors
                                    done

                                    # Key material -> separate bucket, same path
                                    for f in "${keymat[@]}" BACKUP-INFO.txt SHA256SUMS; do
                                      aws s3 cp "${f}" "s3://${S3_KEYS_BUCKET}/${CLUSTER_NAME}/${d}/${f}" \
                                        "${KEYS_SSE[@]}" --only-show-errors
                                    done

                                    echo "  [verify]"
                                    for f in "${snaps[@]}"; do
                                      verify "${S3_BUCKET}" "${CLUSTER_NAME}/${d}/${f}"
                                    done
                                    for f in "${keymat[@]}"; do
                                      verify "${S3_KEYS_BUCKET}" "${CLUSTER_NAME}/${d}/${f}"
                                    done

                                    # Written last, and only on success, so a
                                    # failed upload is retried next pass rather
                                    # than silently skipped. The backup itself
                                    # stays on the node either way.
                                    touch /backups/"${d}"/.uploaded
                                    uploaded=$((uploaded+1))
                                    cd /backups
                                    echo "  [done] s3://${S3_BUCKET}/${CLUSTER_NAME}/${d}/"
                                  done

                                  echo "[summary] node=${NODE_NAME} uploaded=${uploaded}" \
                                       "already-uploaded=${done_already} in-progress=${pending}"
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 512Mi
