---
# Credentials used by the etcd backup CronJob on the MANAGED clusters to write
# to S3. The secret lives ONLY on the hub; the policy pulls it with
# {{hub fromSecret ... hub}}.
#
# ACM automatically encrypts values resolved by `fromSecret` in a hub template
# before they are placed in the per-cluster policy, using a per-cluster AES key
# stored in the cluster's namespace. The plaintext never sits in the replicated
# policy object - which is why this file is the only place it exists, and why
# this file is .gitignore'd.
#
#   cp 03-etcd-backup-s3-secret.example.yaml /tmp/s3-secret.yaml
#   # fill in the values, then:
#   oc apply -f /tmp/s3-secret.yaml && shred -u /tmp/s3-secret.yaml
#
# Prefer IRSA over static keys where the managed cluster runs on AWS - see
# "Alternative: IRSA instead of static keys" in the README.
apiVersion: v1
kind: Secret
metadata:
  name: etcd-backup-s3
  namespace: open-cluster-management-backup
type: Opaque
stringData:
  aws_access_key_id: "CHANGEME"
  aws_secret_access_key: "CHANGEME"
